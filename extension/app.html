<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RayLingo — Full Translator</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="app.css">
</head>
<body data-page-mode="app">
  <main class="app-shell">
    <header class="topbar">
      <div class="brand-mark" aria-hidden="true">文</div>
      <div class="brand-copy">
        <h1>RayLingo</h1>
        <p data-i18n="brandSubtitle">即時、多語、跨瀏覽器</p>
      </div>
      <button id="openAppButton" class="topbar-app-button" type="button" data-i18n="openFullPage">完整網頁</button>
      <div class="topbar-status"><span id="apiBadge" class="api-badge">…</span><span id="integrityBadge" class="integrity-badge" data-state="checking">…</span></div>
    </header>

    <section class="translator-card">
      <div class="language-row">
        <label class="select-wrap">
          <span data-i18n="sourceLanguage">來源語言</span>
          <select id="sourceLanguage"></select>
        </label>
        <button id="swapButton" class="icon-button" type="button" data-i18n-title="swap" title="交換語言" aria-label="Swap">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h11m0 0-3-3m3 3-3 3M17 17H6m0 0 3 3m-3-3 3-3"/></svg>
        </button>
        <label class="select-wrap">
          <span data-i18n="targetLanguage">目標語言</span>
          <select id="targetLanguage"></select>
        </label>
      </div>

      <div id="quickPairs" class="quick-pairs"></div>

      <div class="text-panel input-panel">
        <div class="panel-heading">
          <span id="detectedLabel" data-i18n="detectedInput">輸入文字</span>
          <div class="result-actions">
            <button id="sourceSpeakButton" class="copy-button action-button" type="button" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10v4h4l5 4V6l-5 4H5zM17 9c1.3 1.6 1.3 4.4 0 6M19.5 7c2.5 2.8 2.5 7.2 0 10"/></svg>
              <span id="sourceSpeakButtonLabel" data-i18n="speak">朗讀</span>
            </button>
            <button id="sourceCopyButton" class="copy-button action-button" type="button" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 9h10v10H9zM5 5h10v4M5 5v10h4"/></svg>
              <span data-i18n="copy">複製</span>
            </button>
            <button id="clearButton" class="action-button" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg><span data-i18n="clear">清除</span></button>
          </div>
        </div>
        <textarea id="sourceText" maxlength="12000" spellcheck="false" data-i18n-placeholder="inputPlaceholder" placeholder="開始輸入或貼上文字，將自動翻譯…"></textarea>
        <div class="panel-footer">
          <span id="charCount">0 / 12,000</span>
          <button id="pasteButton" class="text-button" type="button" data-i18n="paste">貼上</button>
        </div>
      </div>

      <div class="status-line" aria-live="polite">
        <span class="status-dot"></span>
        <span id="statusText" data-i18n="readyInput">輸入文字後會自動翻譯</span>
        <span id="progressText" class="progress-text"></span>
      </div>

      <div class="text-panel output-panel">
        <div class="panel-heading">
          <span data-i18n="resultTitle">翻譯結果</span>
          <div class="result-actions">
            <button id="speakButton" class="copy-button action-button" type="button" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10v4h4l5 4V6l-5 4H5zM17 9c1.3 1.6 1.3 4.4 0 6M19.5 7c2.5 2.8 2.5 7.2 0 10"/></svg>
              <span id="speakButtonLabel" data-i18n="speak">朗讀</span>
            </button>
            <button id="copyButton" class="copy-button action-button" type="button" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 9h10v10H9zM5 5h10v4M5 5v10h4"/></svg>
              <span data-i18n="copy">複製</span>
            </button>
          </div>
        </div>
        <div id="translatedText" class="translated-text placeholder" tabindex="0">—</div>
      </div>
    </section>

    <section class="settings-card">
      <div class="settings-title" data-i18n="settingsTitle">偏好設定</div>
      <label class="setting-select-row">
        <span>
          <strong data-i18n="uiLanguage">介面語言</strong>
        </span>
        <select id="uiLocale"></select>
      </label>
      <div class="settings-divider"></div>
      <label class="setting-select-row">
        <span>
          <strong data-i18n="selectionMode">反白行為</strong>
          <small data-i18n="selectionHelp">反白後可直接開啟迷你翻譯器，並在浮窗切換語言</small>
        </span>
        <select id="selectionMode">
          <option value="auto" data-i18n="selectionModeAuto">直接開啟翻譯浮窗</option>
          <option value="button" data-i18n="selectionModeButton">先顯示「譯」按鈕</option>
          <option value="off" data-i18n="selectionModeOff">停用反白翻譯</option>
        </select>
      </label>
      <div class="settings-divider"></div>
      <section class="selection-appearance-settings">
        <div class="selection-appearance-heading">
          <span>
            <strong data-i18n="selectionAppearanceTitle">反白翻譯外觀</strong>
            <small data-i18n="selectionAppearanceHelp">調整「譯」按鈕／小點、大小、黑白背景與強調色</small>
          </span>
        </div>
        <div class="selection-appearance-grid">
          <label class="setting-select-row compact-row">
            <span><strong data-i18n="selectionTriggerStyle">觸發樣式</strong></span>
            <select id="selectionTriggerStyle">
              <option value="label" data-i18n="selectionTriggerStyleLabel">顯示「譯」按鈕</option>
              <option value="dot" data-i18n="selectionTriggerStyleDot">顯示小圓點</option>
            </select>
          </label>
          <label class="setting-select-row compact-row">
            <span><strong data-i18n="selectionSurfaceTheme">背景</strong></span>
            <select id="selectionSurfaceTheme">
              <option value="white" data-i18n="selectionSurfaceWhite">白色</option>
              <option value="black" data-i18n="selectionSurfaceBlack">黑色</option>
            </select>
          </label>
          <label class="selection-size-row">
            <span><strong data-i18n="selectionTriggerSize">按鈕／小點大小</strong><small id="selectionTriggerSizeValue">36px</small></span>
            <input id="selectionTriggerSize" type="range" min="14" max="56" step="1" value="36">
          </label>
          <label class="selection-color-row">
            <span><strong data-i18n="selectionAccentColor">強調色</strong><small id="selectionAccentColorValue">#0f8b8d</small></span>
            <input id="selectionAccentColor" type="color" value="#7658ff">
          </label>
        </div>
        <div id="selectionAppearancePreview" class="selection-appearance-preview">
          <div class="selection-preview-canvas">
            <button id="selectionPreviewTrigger" class="selection-preview-trigger" type="button" tabindex="-1"><span class="selection-preview-label">譯</span><span class="selection-preview-dot"></span></button>
            <div id="selectionPreviewPanel" class="selection-preview-panel"><span class="selection-preview-accent"></span><strong>RayLingo</strong><small data-i18n="selectionPreviewText">反白翻譯預覽</small></div>
          </div>
        </div>
      </section>
      <div class="settings-divider"></div>
      <div class="tts-settings">
        <div class="tts-heading">
          <span>
            <strong data-i18n="ttsTitle">自然語音 TTS</strong>
            <small data-i18n="ttsHelp">自動模式優先使用目前瀏覽器可用的多語言 TTS，並依翻譯目標語言自動選擇聲音</small>
          </span>
          <button id="ttsTestButton" class="mini-action-button" type="button" data-i18n="ttsTest">測試</button>
        </div>
        <label class="setting-select-row compact-row">
          <span><strong data-i18n="ttsEngine">語音引擎</strong></span>
          <select id="ttsEngine">
            <option value="auto" data-i18n="ttsEngineAuto">自動（多語言系統 TTS 優先）</option>
            <option value="ai-browser" data-i18n="ttsEngineAiLocal">瀏覽器 AI（自動下載）</option>
            <option value="system" data-i18n="ttsEngineSystem">系統語音</option>
          </select>
        </label>
        <label class="setting-select-row compact-row">
          <span>
            <strong data-i18n="ttsAiVoice">AI 聲音</strong>
            <small id="ttsAiLanguages" data-i18n="ttsAiLanguagesLoading">正在載入 AI 語言清單…</small>
          </span>
          <select id="ttsVoice"></select>
        </label>
        <small id="ttsAiCompatibilityNote" class="tts-compatibility-note" hidden></small>
        <label class="setting-select-row compact-row">
          <span><strong data-i18n="ttsSystemVoice">系統聲音</strong></span>
          <select id="systemVoice"></select>
        </label>
        <label class="tts-range-row">
          <span><strong data-i18n="ttsSpeed">語速</strong><small id="ttsSpeedValue">1.00×</small></span>
          <input id="ttsSpeed" type="range" min="0.65" max="1.60" step="0.05" value="1">
        </label>
        <div class="tts-status-row">
          <span id="ttsStatusDot" class="tts-status-dot"></span>
          <span id="ttsStatus" data-i18n="ttsStatusChecking">正在檢查多語言語音…</span>
        </div>
        <small class="tts-note" data-i18n="ttsLocalPrivacy">不需額外設定；朗讀語言會跟隨翻譯結果，自動選擇相符聲音。</small>
      </div>
      <div class="settings-divider"></div>
      <label class="toggle-row" for="typingEffectToggle">
        <span><strong data-i18n="typingEffect">結果逐字顯示</strong></span>
        <input id="typingEffectToggle" type="checkbox" checked>
        <span class="toggle-ui" aria-hidden="true"></span>
      </label>
      <div class="settings-divider"></div>
      <label class="toggle-row" for="historyToggle">
        <span><strong data-i18n="historyEnabled">儲存翻譯紀錄（僅本機）</strong></span>
        <input id="historyToggle" type="checkbox" checked>
        <span class="toggle-ui" aria-hidden="true"></span>
      </label>
      <div class="settings-divider"></div>
      <label class="toggle-row" for="remoteFallbackToggle">
        <span>
          <strong data-i18n="remoteTitle">瀏覽器相容／遠端備援</strong>
          <small id="remoteFallbackHelp" data-i18n="remoteHelp">沒有本機 Translator API 時，允許將文字送至 Google Translate</small>
        </span>
        <input id="remoteFallbackToggle" type="checkbox" checked>
        <span class="toggle-ui" aria-hidden="true"></span>
      </label>
    </section>

    <section class="history-card">
      <div class="history-heading">
        <div>
          <strong data-i18n="historyTitle">最近翻譯</strong>
          <small data-i18n="historyLocal">只儲存在這個瀏覽器</small>
        </div>
        <button id="clearHistoryButton" class="text-button" type="button" data-i18n="clearHistory">清除紀錄</button>
      </div>
      <div id="historyList" class="history-list"></div>
    </section>

    <footer>
      <span id="providerNote" data-i18n="providerChecking">正在檢查翻譯引擎…</span>
      <span id="appVersion" class="version">v—</span>
    </footer>
  </main>
  <script src="platform-compat.js"></script>
  <script src="integrity-client.js"></script>
  <script src="language-registry.js"></script>
  <script src="ui-i18n.js"></script>
  <script src="translator-engine.js"></script>
  <script src="tts-registry.js"></script>
  <script src="selection-appearance.js"></script>
  <script src="popup.js"></script>
</body>
</html>
