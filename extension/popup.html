<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RayLingo</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body data-page-mode="popup">
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">文</div>
        <div class="brand-copy">
          <h1>RayLingo</h1>
          <p data-i18n="brandSubtitle">即時、多語、跨瀏覽器</p>
        </div>
      </div>
      <span class="studio-badge">TRANSLATE</span>
    </header>

    <section class="section translator-card">
      <div class="language-row">
        <label class="select-wrap">
          <span data-i18n="sourceLanguage">來源語言</span>
          <select id="sourceLanguage"></select>
        </label>
        <button id="swapButton" class="icon-button" type="button" data-i18n-title="swap" title="交換語言" aria-label="Swap">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h11m0 0-3-3m3 3-3 3M17 17H6m0 0 3 3m-3-3 3-3"/></svg>
        </button>
        <label class="select-wrap">
          <span data-i18n="targetLanguage">目標語言</span>
          <select id="targetLanguage"></select>
        </label>
      </div>

      <div id="quickPairs" class="quick-pairs"></div>

      <div class="text-panel input-panel">
        <div class="panel-heading">
          <span id="detectedLabel" data-i18n="detectedInput">輸入文字</span>
          <div class="result-actions">
            <button id="sourceSpeakButton" class="action-button" type="button" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10v4h4l5 4V6l-5 4H5zM17 9c1.3 1.6 1.3 4.4 0 6M19.5 7c2.5 2.8 2.5 7.2 0 10"/></svg>
              <span id="sourceSpeakButtonLabel" data-i18n="speak">朗讀</span>
            </button>
            <button id="sourceCopyButton" class="action-button" type="button" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 9h10v10H9zM5 5h10v4M5 5v10h4"/></svg>
              <span data-i18n="copy">複製</span>
            </button>
            <button id="clearButton" class="action-button danger-soft" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg>
              <span data-i18n="clear">清除</span>
            </button>
          </div>
        </div>
        <textarea id="sourceText" maxlength="12000" spellcheck="false" data-i18n-placeholder="inputPlaceholder" placeholder="開始輸入或貼上文字，將自動翻譯…"></textarea>
        <div class="panel-footer">
          <span id="charCount">0 / 12,000</span>
          <button id="pasteButton" class="text-button" type="button" data-i18n="paste">貼上</button>
        </div>
      </div>

      <div class="status-line" aria-live="polite">
        <span class="status-dot"></span>
        <span id="statusText" data-i18n="readyInput">輸入文字後會自動翻譯</span>
        <span id="progressText" class="progress-text"></span>
      </div>

      <div class="text-panel output-panel">
        <div class="panel-heading">
          <span data-i18n="resultTitle">翻譯結果</span>
          <div class="result-actions">
            <button id="speakButton" class="action-button" type="button" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10v4h4l5 4V6l-5 4H5zM17 9c1.3 1.6 1.3 4.4 0 6M19.5 7c2.5 2.8 2.5 7.2 0 10"/></svg>
              <span id="speakButtonLabel" data-i18n="speak">朗讀</span>
            </button>
            <button id="copyButton" class="action-button" type="button" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 9h10v10H9zM5 5h10v4M5 5v10h4"/></svg>
              <span data-i18n="copy">複製</span>
            </button>
          </div>
        </div>
        <div id="translatedText" class="translated-text placeholder" tabindex="0">—</div>
      </div>
    </section>

    <details class="quick-settings section" open>
      <summary><span data-i18n="quickSettings">快速設定</span><small data-i18n="selectionHelp">反白後直接開啟迷你翻譯器，並在浮窗切換語言。</small></summary>
      <div class="quick-settings-body">
        <div class="compact-grid two">
          <label class="compact-field"><span data-i18n="uiLanguage">介面語言</span><select id="uiLocale"></select></label>
          <label class="compact-toggle"><span><b data-i18n="typingEffect">結果逐字顯示</b><small data-i18n="workspaceTypingHelp">讓翻譯結果以打字效果呈現。</small></span><input id="typingEffectToggle" type="checkbox" checked></label>
        </div>
        <div class="mini-divider"></div>
        <div class="compact-grid two">
          <label class="compact-field"><span data-i18n="selectionMode">反白行為</span><select id="selectionMode"><option value="auto" data-i18n="selectionModeAuto">直接開啟翻譯浮窗</option><option value="button" data-i18n="selectionModeButton">先顯示「譯」按鈕</option><option value="off" data-i18n="selectionModeOff">停用反白翻譯</option></select></label>
          <label class="compact-field"><span data-i18n="selectionTriggerStyle">觸發樣式</span><select id="selectionTriggerStyle"><option value="label" data-i18n="selectionTriggerStyleLabel">顯示「譯」按鈕</option><option value="dot" data-i18n="selectionTriggerStyleDot">顯示小圓點</option></select></label>
        </div>
        <div class="compact-label" data-i18n="selectionDefaultLanguages">反白預設語言</div>
        <div class="language-row selection-language-row">
          <label class="select-wrap"><span data-i18n="sourceLanguage">來源語言</span><select id="selectionSourceLanguage"></select></label>
          <span class="language-arrow" aria-hidden="true">→</span>
          <label class="select-wrap"><span data-i18n="targetLanguage">目標語言</span><select id="selectionTargetLanguage"></select></label>
        </div>
        <div class="compact-grid two appearance-controls">
          <label class="compact-field"><span data-i18n="selectionSurfaceTheme">背景</span><select id="selectionSurfaceTheme"><option value="black" data-i18n="selectionSurfaceBlack">黑色</option><option value="white" data-i18n="selectionSurfaceWhite">白色</option></select></label>
          <label class="compact-color"><span><b data-i18n="selectionAccentColor">強調色</b><code id="selectionAccentColorValue">#7c5cff</code></span><input id="selectionAccentColor" type="color" value="#7c5cff" aria-label="Accent color"></label>
        </div>
        <label class="compact-range"><span><b data-i18n="selectionTriggerSize">按鈕／小點大小</b><small id="selectionTriggerSizeValue">36px</small></span><input id="selectionTriggerSize" type="range" min="14" max="56" step="1" value="36"></label>
        <div id="accentPalette" class="popup-accent-palette" role="radiogroup" aria-label="Accent color">
          <button type="button" data-accent="#7c5cff" title="Violet"></button><button type="button" data-accent="#3ea6ff" title="Blue"></button><button type="button" data-accent="#00c2d7" title="Cyan"></button><button type="button" data-accent="#35c982" title="Green"></button><button type="button" data-accent="#f1b44c" title="Amber"></button><button type="button" data-accent="#ff5f7a" title="Rose"></button><button type="button" data-accent="#d966ff" title="Magenta"></button><button type="button" data-accent="#f4f4f5" title="Neutral"></button>
        </div>
        <div id="selectionAppearancePreview" class="selection-appearance-preview compact-preview">
          <div class="selection-preview-canvas"><button id="selectionPreviewTrigger" class="selection-preview-trigger" type="button" tabindex="-1"><span class="selection-preview-label">譯</span><span class="selection-preview-dot"></span></button><div id="selectionPreviewPanel" class="selection-preview-panel"><span class="selection-preview-accent"></span><strong>RayLingo</strong><small data-i18n="selectionPreviewText">反白翻譯預覽</small></div></div>
        </div>
        <p class="selection-input-hint" data-i18n="selectionInputHint">可反白一般網頁文字，也支援輸入框與文字區域內的選取文字。</p>
      </div>
    </details>


    <details class="quick-settings section ai-media-settings" open>
      <summary><span data-i18n="aiMediaTitle">AI、懸浮窗與媒體</span><small data-i18n="aiMediaHelp">Gemini／DeepSeek、文件與影片翻譯。</small></summary>
      <div class="quick-settings-body">
        <div class="compact-grid two">
          <label class="compact-field"><span data-i18n="translationProvider">翻譯引擎</span><select id="translationProvider"><option value="auto">AUTO · Browser</option><option value="browser">Browser / Google fallback</option><option value="gemini">Gemini AI</option><option value="deepseek">DeepSeek AI</option></select></label>
          <label class="compact-toggle"><span><b data-i18n="floatingWidgetEnabled">常駐懸浮窗</b><small data-i18n="floatingWidgetHelp">縮成一個點，隨時展開翻譯。</small></span><input id="floatingWidgetEnabled" type="checkbox"></label>
        </div>
        <div class="compact-grid two">
          <label class="compact-toggle"><span><b data-i18n="floatingWidgetHoverExpand">滑鼠移上自動展開</b><small data-i18n="floatingWidgetHoverHelp">游標移到懸浮點時展開。</small></span><input id="floatingWidgetHoverExpand" type="checkbox" checked></label>
          <label class="compact-toggle"><span><b data-i18n="floatingWidgetStartCollapsed">啟動時縮小</b><small data-i18n="floatingWidgetCollapsedHelp">新分頁先顯示一個點。</small></span><input id="floatingWidgetStartCollapsed" type="checkbox" checked></label>
        </div>
        <div class="mini-divider"></div>
        <div class="compact-label" data-i18n="multimodalTitle">圖片／文件／音訊／影片</div>
        <div class="file-action-row"><input id="multimodalFile" type="file" accept="image/*,application/pdf,.docx,.pptx,text/*,audio/*,video/*,.srt,.vtt"><button id="multimodalProcessButton" class="action-button" type="button" data-i18n="processFile">翻譯檔案</button></div>
        <p id="multimodalStatus" class="inline-feature-status" data-i18n="multimodalIdle">尚未選擇檔案</p>
        <div class="compact-grid two">
          <label class="compact-toggle"><span><b data-i18n="videoSubtitleEnabled">影片字幕翻譯</b><small data-i18n="videoSubtitleHelp">偵測字幕並顯示 RayLingo 翻譯 overlay。</small></span><input id="videoSubtitleEnabled" type="checkbox"></label>
          <label class="compact-field"><span data-i18n="videoSubtitleTarget">字幕目標語言</span><select id="videoSubtitleTargetLanguage"></select></label>
        </div>
        <label class="compact-toggle privacy-consent"><span><b data-i18n="remoteMediaConsent">允許遠端媒體處理</b><small data-i18n="remoteMediaConsentHelp">圖片／PDF／音訊／影片或公開 YouTube URL 只有在你操作時才會送給 Gemini。</small></span><input id="remoteMediaConsent" type="checkbox"></label>
        <button id="videoTranscriptButton" class="wide-feature-button" type="button" data-i18n="videoTranscriptStart">目前影片：AI 取文字並翻譯</button>
        <p id="videoStatus" class="inline-feature-status" data-i18n="videoTranscriptPrivacy">沒有字幕時才使用；YouTube 送公開 URL，其他 Chromium 分頁則由你明確開始／停止擷取。</p>
      </div>
    </details>

    <div class="options-cta">
      <button id="openAppButton" type="button">
        <span data-i18n="openFullPage">完整網頁</span>
        <small data-i18n="workspaceLauncherHelp">語音、反白、外觀、歷史與安全設定</small>
        <b aria-hidden="true">›</b>
      </button>
    </div>

    <footer class="popup-footer">
      <div class="runtime-copy">
        <span id="providerNote" data-i18n="providerChecking">正在檢查翻譯引擎…</span>
        <small>RayLingo Studio UI</small>
      </div>
      <div class="footer-badges">
        <span id="apiBadge" class="api-badge">…</span>
        <span id="integrityBadge" class="integrity-badge" data-state="checking">…</span>
        <span id="appVersion" class="version-badge">v—</span>
      </div>
    </footer>
  </main>
  <script src="platform-compat.js"></script>
  <script src="integrity-client.js"></script>
  <script src="language-registry.js"></script>
  <script src="ui-i18n.js"></script>
  <script src="ai-provider.js"></script>
  <script src="translator-engine.js"></script>
  <script src="multimodal.js"></script>
  <script src="tts-registry.js"></script>
  <script src="selection-appearance.js"></script>
  <script src="popup.js"></script>
</body>
</html>
