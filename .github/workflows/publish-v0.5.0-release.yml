name: Publish RayLingo v0.5.0 Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v0.5.0-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build platform packages
        shell: bash
        run: |
          set -euo pipefail
          test "$(python -c 'import json; print(json.load(open("extension/manifest.json"))["version"])')" = "0.5.0"
          rm -rf release-work
          mkdir -p release-work/{chromium,firefox,safari,source}
          cp -a extension/. release-work/chromium/
          cp -a extension/. release-work/firefox/
          rm -f release-work/firefox/offscreen.html release-work/firefox/offscreen.js release-work/firefox/piper-autoinstall.js
          cp platform/manifest.firefox.json release-work/firefox/manifest.json
          cp .release_meta/firefox-integrity-v0.5.0.json release-work/firefox/integrity-manifest.json
          cp -a extension/. release-work/safari/
          rm -f release-work/safari/offscreen.html release-work/safari/offscreen.js release-work/safari/piper-autoinstall.js
          cp platform/manifest.safari.json release-work/safari/manifest.json
          cp .release_meta/safari-integrity-v0.5.0.json release-work/safari/integrity-manifest.json
          cp -a extension/. release-work/source/
          cp platform/manifest.firefox.json release-work/source/manifest.firefox.json
          cp platform/manifest.safari.json release-work/source/manifest.safari.json

      - name: Verify signed package integrity
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'); const path=require('path'); const crypto=require('crypto');
          const PUBLIC_KEY_B64='BSvI+aEQja2zdnXo3OIxReAHOAzxwx85aTotVeKEppQ=';
          const KEY_ID='ed25519-sha256:7d9fa0219c46ac10b516adc04f2234ded87f4f9ed7423e671190cfa6d62096ed';
          function canonicalize(v){ if(Array.isArray(v))return '['+v.map(canonicalize).join(',')+']'; if(v&&typeof v==='object')return '{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+canonicalize(v[k])).join(',')+'}'; return JSON.stringify(v); }
          async function verifyPackage(root){
            const m=JSON.parse(fs.readFileSync(path.join(root,'integrity-manifest.json'),'utf8'));
            if(m.algorithm!=='Ed25519'||m.keyId!==KEY_ID||m.signed.version!=='0.5.0') throw new Error(`${root}: metadata mismatch`);
            for(const e of m.signed.files){ const p=path.join(root,e.path); const b=fs.readFileSync(p); const h=crypto.createHash('sha256').update(b).digest('hex'); if(b.length!==e.size||h!==e.sha256) throw new Error(`${root}: hash mismatch ${e.path}`); }
            const key=await crypto.webcrypto.subtle.importKey('raw',Buffer.from(PUBLIC_KEY_B64,'base64'),{name:'Ed25519'},false,['verify']);
            const ok=await crypto.webcrypto.subtle.verify({name:'Ed25519'},key,Buffer.from(m.signature,'base64'),Buffer.from(canonicalize(m.signed)));
            if(!ok) throw new Error(`${root}: signature mismatch`);
            console.log(`${root}: integrity PASS (${m.signed.files.length} protected files)`);
          }
          Promise.all(['release-work/chromium','release-work/firefox','release-work/safari'].map(verifyPackage)).catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Verify signed update metadata
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'); const crypto=require('crypto');
          const PUBLIC_KEY_B64='BSvI+aEQja2zdnXo3OIxReAHOAzxwx85aTotVeKEppQ='; const KEY_ID='ed25519-sha256:7d9fa0219c46ac10b516adc04f2234ded87f4f9ed7423e671190cfa6d62096ed';
          function canonicalize(v){ if(Array.isArray(v))return '['+v.map(canonicalize).join(',')+']'; if(v&&typeof v==='object')return '{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+canonicalize(v[k])).join(',')+'}'; return JSON.stringify(v); }
          (async()=>{ const m=JSON.parse(fs.readFileSync('updates/latest.json','utf8')); if(m.keyId!==KEY_ID||m.signed.version!=='0.5.0') throw new Error('update metadata mismatch'); const key=await crypto.webcrypto.subtle.importKey('raw',Buffer.from(PUBLIC_KEY_B64,'base64'),{name:'Ed25519'},false,['verify']); const ok=await crypto.webcrypto.subtle.verify({name:'Ed25519'},key,Buffer.from(m.signature,'base64'),Buffer.from(canonicalize(m.signed))); if(!ok) throw new Error('update signature mismatch'); console.log('update metadata PASS'); })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Create ZIP assets
        shell: bash
        run: |
          set -euo pipefail
          (cd release-work/chromium && zip -q -X -r "$GITHUB_WORKSPACE/RayLingo_v0.5.0_chromium.zip" .)
          (cd release-work/firefox && zip -q -X -r "$GITHUB_WORKSPACE/RayLingo_v0.5.0_firefox.zip" .)
          (cd release-work/safari && zip -q -X -r "$GITHUB_WORKSPACE/RayLingo_v0.5.0_safari-source.zip" .)
          (cd release-work/source && zip -q -X -r "$GITHUB_WORKSPACE/RayLingo_v0.5.0_source.zip" .)
          for f in RayLingo_v0.5.0_*.zip; do unzip -t "$f" >/dev/null; sha256sum "$f"; done

      - name: Write release notes
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          ## RayLingo v0.5.0

          ### 修正
          - 修正更新檢查 verifier context 錯誤，不再把 verifier 未載入誤報為 `UPDATE_SIGNATURE_INVALID`。
          - Update Checker 現在區分 Ed25519/WebCrypto 不支援、Key ID 不符與真正簽章無效。
          - Brave 品牌與 Translator API capability 分開偵測。

          ### UI / 反白翻譯
          - 強調色改為接近 YouTube Speed Studio 的 semantic tint：深黑表面、半透明 active/hover/focus/status，而非大面積純色填滿。
          - 保留反白翻譯來源／目標語言選擇、複製、朗讀與逐字結果顯示。
          - 翻譯結果明確維持可選取文字。

          ### 安全
          - v0.5.0 使用 signing identity v2。v0.4.8 舊私鑰不在本次工作階段，且 v0.4.8 updater 本身有 verifier-context bug，因此這次需要手動安裝 v0.5.0 完成一次 trust rollover。
          EOF

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.5.0 >/dev/null 2>&1; then
            echo 'v0.5.0 Release already exists' >&2
            exit 1
          fi
          gh release create v0.5.0 \
            RayLingo_v0.5.0_chromium.zip \
            RayLingo_v0.5.0_firefox.zip \
            RayLingo_v0.5.0_safari-source.zip \
            RayLingo_v0.5.0_source.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'RayLingo v0.5.0' \
            --notes-file release-notes.md
          gh release view v0.5.0 --repo "$GITHUB_REPOSITORY" --json tagName,url,assets
