name: Verify RayLingo v0.7.1 Runtime

on:
  push:
    branches: [feature/visible-translation-v0.6.0]
    paths:
      - '.github/workflows/runtime-v0.7.1.yml'
      - '.github/scripts/runtime-v0.7.1.mjs'
      - 'extension/**'
      - 'platform/**'
      - '.release_meta/**'
      - 'updates/latest.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax and JSON gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(python -c 'import json; print(json.load(open("extension/manifest.json"))["version"])')" = "0.7.1"
          for f in extension/*.js; do node --check "$f" >/dev/null; done
          node --check .github/scripts/runtime-v0.7.1.mjs >/dev/null
          python - <<'PY'
          import glob,json
          for p in glob.glob('extension/_locales/*/messages.json')+['extension/manifest.json','platform/manifest.firefox.json','platform/manifest.safari.json','updates/latest.json']:
              json.load(open(p,encoding='utf-8'))
          print('syntax/json PASS')
          PY

      - name: Build and verify signed packages
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-work
          mkdir -p release-work/{chromium,firefox,safari,source}
          cp -a extension/. release-work/chromium/
          cp -a extension/. release-work/firefox/
          rm -f release-work/firefox/offscreen.html release-work/firefox/offscreen.js release-work/firefox/piper-autoinstall.js
          cp platform/manifest.firefox.json release-work/firefox/manifest.json
          cp .release_meta/firefox-integrity-v0.7.1.json release-work/firefox/integrity-manifest.json
          cp -a extension/. release-work/safari/
          rm -f release-work/safari/offscreen.html release-work/safari/offscreen.js release-work/safari/piper-autoinstall.js
          cp platform/manifest.safari.json release-work/safari/manifest.json
          cp .release_meta/safari-integrity-v0.7.1.json release-work/safari/integrity-manifest.json
          cp -a extension/. release-work/source/
          cp platform/manifest.firefox.json release-work/source/manifest.firefox.json
          cp platform/manifest.safari.json release-work/source/manifest.safari.json
          node <<'NODE'
          const fs=require('fs'),path=require('path'),crypto=require('crypto');
          const PUB='aX2fqaYF7j0JcRbVDUkkqpYicLimgnhN90znvhO0RUE=';
          const KID='ed25519-sha256:c9a44509e7b9249e71c8e5fa8ce41daf47277cb13c4130d8248cc64658b9868a';
          function c(v){if(Array.isArray(v))return '['+v.map(c).join(',')+']';if(v&&typeof v==='object')return '{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+c(v[k])).join(',')+'}';return JSON.stringify(v)}
          async function verify(root,count){const m=JSON.parse(fs.readFileSync(path.join(root,'integrity-manifest.json')));if(m.keyId!==KID||m.signed.version!=='0.7.1'||m.signed.files.length!==count)throw Error(root+' metadata');for(const e of m.signed.files){const b=fs.readFileSync(path.join(root,e.path));if(b.length!==e.size||crypto.createHash('sha256').update(b).digest('hex')!==e.sha256)throw Error(root+' hash '+e.path)}const k=await crypto.webcrypto.subtle.importKey('raw',Buffer.from(PUB,'base64'),{name:'Ed25519'},false,['verify']);if(!await crypto.webcrypto.subtle.verify({name:'Ed25519'},k,Buffer.from(m.signature,'base64'),Buffer.from(c(m.signed))))throw Error(root+' signature');console.log(root,'PASS',count)}
          (async()=>{await verify('release-work/chromium',43);await verify('release-work/firefox',40);await verify('release-work/safari',40);const m=JSON.parse(fs.readFileSync('updates/latest.json'));if(m.keyId!==KID||m.signed.version!=='0.7.1'||'trustGeneration' in m.signed)throw Error('update metadata');const k=await crypto.webcrypto.subtle.importKey('raw',Buffer.from(PUB,'base64'),{name:'Ed25519'},false,['verify']);if(!await crypto.webcrypto.subtle.verify({name:'Ed25519'},k,Buffer.from(m.signature,'base64'),Buffer.from(c(m.signed))))throw Error('update signature');console.log('update PASS')})().catch(e=>{console.error(e);process.exit(1)})
          NODE
          (cd release-work/chromium && zip -q -X -r "$GITHUB_WORKSPACE/RayLingo_v0.7.1_chromium.zip" .)
          (cd release-work/firefox && zip -q -X -r "$GITHUB_WORKSPACE/RayLingo_v0.7.1_firefox.zip" .)
          (cd release-work/safari && zip -q -X -r "$GITHUB_WORKSPACE/RayLingo_v0.7.1_safari-source.zip" .)
          (cd release-work/source && zip -q -X -r "$GITHUB_WORKSPACE/RayLingo_v0.7.1_source.zip" .)
          for f in RayLingo_v0.7.1_*.zip; do unzip -t "$f" >/dev/null; sha256sum "$f"; done

      - name: Chromium Puppeteer runtime gate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/raylingo-puppeteer
          mkdir -p /tmp/raylingo-puppeteer
          cd /tmp/raylingo-puppeteer
          npm init -y >/dev/null
          npm install --no-save --no-audit --no-fund puppeteer@latest
          cp "$GITHUB_WORKSPACE/.github/scripts/runtime-v0.7.1.mjs" ./runtime.mjs
          node ./runtime.mjs "$GITHUB_WORKSPACE/release-work/chromium"

      - uses: actions/upload-artifact@v4
        with:
          name: raylingo-v0.7.1-verified-candidate
          path: RayLingo_v0.7.1_*.zip
          if-no-files-found: error
