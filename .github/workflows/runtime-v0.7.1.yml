name: Verify RayLingo v0.7.1 Runtime

on:
  push:
    branches: [feature/visible-translation-v0.6.0]
    paths:
      - '.github/workflows/runtime-v0.7.1.yml'
      - 'extension/**'
      - 'platform/**'
      - '.release_meta/**'
      - 'updates/latest.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax and JSON gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(python -c 'import json; print(json.load(open("extension/manifest.json"))["version"])')" = "0.7.1"
          for f in extension/*.js; do node --check "$f" >/dev/null; done
          python - <<'PY'
          import glob,json
          for p in glob.glob('extension/_locales/*/messages.json')+['extension/manifest.json','platform/manifest.firefox.json','platform/manifest.safari.json','updates/latest.json']:
              json.load(open(p,encoding='utf-8'))
          print('syntax/json PASS')
          PY

      - name: Build and verify signed packages
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-work
          mkdir -p release-work/{chromium,firefox,safari,source}
          cp -a extension/. release-work/chromium/
          cp -a extension/. release-work/firefox/
          rm -f release-work/firefox/offscreen.html release-work/firefox/offscreen.js release-work/firefox/piper-autoinstall.js
          cp platform/manifest.firefox.json release-work/firefox/manifest.json
          cp .release_meta/firefox-integrity-v0.7.1.json release-work/firefox/integrity-manifest.json
          cp -a extension/. release-work/safari/
          rm -f release-work/safari/offscreen.html release-work/safari/offscreen.js release-work/safari/piper-autoinstall.js
          cp platform/manifest.safari.json release-work/safari/manifest.json
          cp .release_meta/safari-integrity-v0.7.1.json release-work/safari/integrity-manifest.json
          cp -a extension/. release-work/source/
          cp platform/manifest.firefox.json release-work/source/manifest.firefox.json
          cp platform/manifest.safari.json release-work/source/manifest.safari.json
          node <<'NODE'
          const fs=require('fs'),path=require('path'),crypto=require('crypto');
          const PUB='aX2fqaYF7j0JcRbVDUkkqpYicLimgnhN90znvhO0RUE=';
          const KID='ed25519-sha256:c9a44509e7b9249e71c8e5fa8ce41daf47277cb13c4130d8248cc64658b9868a';
          function c(v){if(Array.isArray(v))return '['+v.map(c).join(',')+']';if(v&&typeof v==='object')return '{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+c(v[k])).join(',')+'}';return JSON.stringify(v)}
          async function verify(root,count){const m=JSON.parse(fs.readFileSync(path.join(root,'integrity-manifest.json')));if(m.keyId!==KID||m.signed.version!=='0.7.1'||m.signed.files.length!==count)throw Error(root+' metadata');for(const e of m.signed.files){const b=fs.readFileSync(path.join(root,e.path));if(b.length!==e.size||crypto.createHash('sha256').update(b).digest('hex')!==e.sha256)throw Error(root+' hash '+e.path)}const k=await crypto.webcrypto.subtle.importKey('raw',Buffer.from(PUB,'base64'),{name:'Ed25519'},false,['verify']);if(!await crypto.webcrypto.subtle.verify({name:'Ed25519'},k,Buffer.from(m.signature,'base64'),Buffer.from(c(m.signed))))throw Error(root+' signature');console.log(root,'PASS',count)}
          (async()=>{await verify('release-work/chromium',43);await verify('release-work/firefox',40);await verify('release-work/safari',40);const m=JSON.parse(fs.readFileSync('updates/latest.json'));if(m.keyId!==KID||m.signed.version!=='0.7.1'||'trustGeneration' in m.signed)throw Error('update metadata');const k=await crypto.webcrypto.subtle.importKey('raw',Buffer.from(PUB,'base64'),{name:'Ed25519'},false,['verify']);if(!await crypto.webcrypto.subtle.verify({name:'Ed25519'},k,Buffer.from(m.signature,'base64'),Buffer.from(c(m.signed))))throw Error('update signature');console.log('update PASS')})().catch(e=>{console.error(e);process.exit(1)})
          NODE
          (cd release-work/chromium && zip -q -X -r "$GITHUB_WORKSPACE/RayLingo_v0.7.1_chromium.zip" .)
          (cd release-work/firefox && zip -q -X -r "$GITHUB_WORKSPACE/RayLingo_v0.7.1_firefox.zip" .)
          (cd release-work/safari && zip -q -X -r "$GITHUB_WORKSPACE/RayLingo_v0.7.1_safari-source.zip" .)
          (cd release-work/source && zip -q -X -r "$GITHUB_WORKSPACE/RayLingo_v0.7.1_source.zip" .)
          for f in RayLingo_v0.7.1_*.zip; do unzip -t "$f" >/dev/null; sha256sum "$f"; done

      - name: Chromium unpacked runtime gate
        shell: bash
        env:
          DISPLAY: ':99'
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          DRIVER_BIN="$(command -v chromedriver || true)"
          test -n "$CHROME_BIN" && test -n "$DRIVER_BIN"
          Xvfb :99 -screen 0 1280x900x24 >/tmp/xvfb.log 2>&1 &
          cat > /tmp/raylingo-runtime.py <<'PY'
          import json,os,subprocess,time,threading,http.server,socketserver,urllib.request
          chrome=os.environ['CHROME_BIN']; driver=os.environ['DRIVER_BIN']; ext=os.path.abspath('release-work/chromium')
          class H(http.server.SimpleHTTPRequestHandler):
              def log_message(self,*a): pass
          os.makedirs('/tmp/rlsite',exist_ok=True); open('/tmp/rlsite/index.html','w').write('<!doctype html><p id="probe">RayLingo runtime selection probe text.</p>')
          os.chdir('/tmp/rlsite'); srv=socketserver.TCPServer(('127.0.0.1',8123),H); threading.Thread(target=srv.serve_forever,daemon=True).start(); os.chdir(os.environ['GITHUB_WORKSPACE'])
          proc=subprocess.Popen([driver,'--port=9515','--log-path=/tmp/chromedriver.log'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          def req(method,path,data=None):
              body=None if data is None else json.dumps(data).encode(); r=urllib.request.Request('http://127.0.0.1:9515'+path,data=body,method=method,headers={'Content-Type':'application/json'}); return json.load(urllib.request.urlopen(r,timeout=15))
          for _ in range(80):
              try: req('GET','/status'); break
              except Exception: time.sleep(.1)
          caps={'capabilities':{'alwaysMatch':{'browserName':'chrome','goog:chromeOptions':{'binary':chrome,'args':['--no-sandbox','--disable-dev-shm-usage','--disable-gpu','--window-size=1280,900',f'--load-extension={ext}']}}}}
          ses=req('POST','/session',caps); sid=ses.get('sessionId') or ses.get('value',{}).get('sessionId'); assert sid,ses
          def nav(url): req('POST',f'/session/{sid}/url',{'url':url})
          def js(script): return req('POST',f'/session/{sid}/execute/sync',{'script':script,'args':[]})['value']
          def asyncjs(script): return req('POST',f'/session/{sid}/execute/async',{'script':script,'args':[]})['value']
          nav('http://127.0.0.1:8123/'); time.sleep(2)
          targets=req('POST',f'/session/{sid}/goog/cdp/execute',{'cmd':'Target.getTargets','params':{}})['value']['targetInfos']
          urls=[x.get('url','') for x in targets]; sw=next((u for u in urls if u.startswith('chrome-extension://') and u.endswith('/service-worker.js')),None); assert sw,urls
          extid=sw.split('/')[2]
          nav(f'chrome-extension://{extid}/popup.html'); time.sleep(2)
          ids=['selectionMode','selectionSourceLanguage','selectionTargetLanguage','typingEffectToggle','floatingWidgetEnabled','floatingWidgetHoverExpand','floatingWidgetStartCollapsed','translationProvider','multimodalFile','videoSubtitleEnabled','videoTranscriptButton']
          st=js("return {version:chrome.runtime.getManifest().version,integrity:document.documentElement.dataset.integrity,ids:"+json.dumps(ids)+".map(x=>[x,!!document.getElementById(x)])}")
          assert st['version']=='0.7.1' and st['integrity']=='verified' and all(v for _,v in st['ids']),st
          asyncjs("const done=arguments[arguments.length-1];chrome.storage.local.set({floatingWidgetEnabled:false,selectionMode:'auto'}).then(()=>done(true),e=>done(String(e)))")
          nav('http://127.0.0.1:8123/'); time.sleep(1); assert js("return !document.getElementById('__raylingo_root__')")
          js("const r=document.createRange();r.selectNodeContents(document.getElementById('probe'));const s=getSelection();s.removeAllRanges();s.addRange(r);document.dispatchEvent(new MouseEvent('mouseup',{bubbles:true}));return true")
          time.sleep(2); assert js("return !!document.getElementById('__raylingo_root__')")
          nav(f'chrome-extension://{extid}/popup.html'); time.sleep(1)
          asyncjs("const done=arguments[arguments.length-1];chrome.storage.local.set({floatingWidgetEnabled:true,floatingWidgetHoverExpand:true,floatingWidgetStartCollapsed:true,floatingWidgetCollapsed:true,selectionMode:'off'}).then(()=>done(true),e=>done(String(e)))")
          nav('http://127.0.0.1:8123/'); time.sleep(2); assert js("return !!document.getElementById('__raylingo_root__')")
          nav(f'chrome-extension://{extid}/workspace.html'); time.sleep(2)
          ids2=['geminiModel','geminiApiKey','deepseekModel','deepseekApiKey','geminiTestButton','deepseekTestButton','remoteMediaConsent']
          st2=js("return "+json.dumps(ids2)+".map(x=>[x,!!document.getElementById(x)])"); assert all(v for _,v in st2),st2
          print('Chromium runtime PASS',extid)
          try:req('DELETE',f'/session/{sid}')
          finally: proc.terminate(); srv.shutdown()
          PY
          CHROME_BIN="$CHROME_BIN" DRIVER_BIN="$DRIVER_BIN" python /tmp/raylingo-runtime.py

      - uses: actions/upload-artifact@v4
        with:
          name: raylingo-v0.7.1-verified-candidate
          path: RayLingo_v0.7.1_*.zip
          if-no-files-found: error
